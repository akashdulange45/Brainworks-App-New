<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Payment Management</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

/* Sidebar */
.sidebar{
    width:220px;
    height:100vh;
    background:#2c3e50;
    position:fixed;
    left:0;
    top:0;
}

.sidebar h2{
    color:white;
    text-align:center;
    padding:20px 0;
    border-bottom:1px solid #444;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:#34495e;
}

/* Main Content */
.main-content{
    margin-left:220px;
    padding:20px;
}

/* Header */
.header{
    background:#3498db;
    color:white;
    padding:15px;
    border-radius:5px;
    margin-bottom:20px;
}

/* Table Container */
.table-container{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:#3498db;
    color:white;
}

table, th, td{
    border:1px solid #ddd;
}

th, td{
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f9f9f9;
}

/* Buttons */
.btn{
    display:inline-block;
    padding:8px 14px;
    color:white;
    text-decoration:none;
    border-radius:5px;
    font-size:14px;
    margin:2px;
}

.approve{
    background:#27ae60;
}

.approve:hover{
    background:#219150;
}

.reject{
    background:#e74c3c;
}

.reject:hover{
    background:#c0392b;
}

/* Back Button */
.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 15px;
    background:#2c3e50;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.back-btn:hover{
    background:#1f2d3a;
}
</style>

</head>
<body>

<!-- Sidebar -->
<div class="sidebar">

    <h2>BrainWorks</h2>

    <a th:href="@{/admin/dashboard}">🏠 Home</a>
    <a th:href="@{/admin/courses}">🏷️ Courses</a>
    <a th:href="@{/admin/students}">👨‍🎓 Students</a>
    <a th:href="@{/admin/payments}">💳 Payments</a>

</div>

<!-- Main Content -->
<div class="main-content">

    <div class="header">
        <h1>Payment Management</h1>
        <p>Manage student payment approvals and rejections</p>
    </div>

    <div class="table-container">

        <table>

            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Course</th>
                <th>Transaction ID</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            <tr th:each="payment : ${payments}">

                <td th:text="${payment.id}"></td>

                <td th:text="${payment.studentName}"></td>

                <td th:text="${payment.courseName}"></td>

                <td th:text="${payment.transactionId}"></td>

                <td th:text="${payment.amount}"></td>

                <td th:text="${payment.status}"></td>

                <td>

                    <a class="btn approve"
                       th:href="@{/admin/payment/approve/{id}(id=${payment.id})}">
                        Approve
                    </a>

                    <a class="btn reject"
                       th:href="@{/admin/payment/reject/{id}(id=${payment.id})}">
                        Reject
                    </a>

                </td>

            </tr>

        </table>

    </div>

    <a class="back-btn"
       th:href="@{/admin/dashboard}">
        ← Back To Dashboard
    </a>

</div>

</body>
</html>
