<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Course</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

/* Sidebar */
.sidebar{
    width:220px;
    height:100vh;
    background:#2c3e50;
    position:fixed;
    left:0;
    top:0;
}

.sidebar h2{
    color:white;
    text-align:center;
    padding:20px 0;
    border-bottom:1px solid #444;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:#34495e;
}

/* Main Content */
.main-content{
    margin-left:220px;
    padding:20px;
}

/* Header */
.header{
    background:#3498db;
    color:white;
    padding:15px;
    border-radius:5px;
    margin-bottom:25px;
}

/* Form Card */
.form-container{
    max-width:700px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.form-container h2{
    margin-bottom:20px;
    color:#2c3e50;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

.form-group textarea{
    resize:vertical;
    min-height:120px;
}

/* Buttons */
.btn{
    padding:12px 20px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
    font-size:14px;
}

.save-btn{
    background:#27ae60;
}

.save-btn:hover{
    background:#219150;
}

.back-btn{
    background:#2c3e50;
    margin-top:15px;
}

.back-btn:hover{
    background:#1f2d3a;
}
</style>

</head>
<body>

<!-- Sidebar -->
<div class="sidebar">

    <h2>BrainWorks</h2>

    <a th:href="@{/admin/dashboard}">🏠 Home</a>
    <a th:href="@{/admin/courses}">🏷️ Courses</a>
    <a th:href="@{/admin/students}">👨‍🎓 Students</a>
    <a th:href="@{/admin/payments}">💳 Payments</a>

</div>

<!-- Main Content -->
<div class="main-content">

    <div class="header">
        <h1>Add New Course</h1>
        <p>Create a new course for students</p>
    </div>

    <div class="form-container">

        <h2>Course Details</h2>

        <form th:action="@{/admin/course/save}"
              th:object="${course}"
              method="post">

            <div class="form-group">
                <label>Course Title</label>
                <input type="text"
                       th:field="*{title}"
                       placeholder="Enter Course Title"
                       required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}"
                          placeholder="Enter Course Description"
                          required></textarea>
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="number"
                       step="0.01"
                       th:field="*{price}"
                       placeholder="Enter Course Price"
                       required>
            </div>

            <div class="form-group">
                <label>Duration</label>
                <input type="text"
                       th:field="*{duration}"
                       placeholder="e.g. 3 Months"
                       required>
            </div>

            <button type="submit" class="btn save-btn">
                Save Course
            </button>

        </form>

        <br>

        <a th:href="@{/admin/courses}"
           class="btn back-btn">
            ← Back To Courses
        </a>

    </div>

</div>

</body>
</html>
