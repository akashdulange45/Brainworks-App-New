<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Course Management</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
}

/* Sidebar */
.sidebar{
    width:220px;
    height:100vh;
    background:#2c3e50;
    position:fixed;
    left:0;
    top:0;
}

.sidebar h2{
    color:white;
    text-align:center;
    padding:20px 0;
    border-bottom:1px solid #444;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:#34495e;
}

/* Main Content */
.main-content{
    margin-left:220px;
    padding:20px;
}

.header{
    background:#3498db;
    color:white;
    padding:15px;
    border-radius:5px;
    margin-bottom:20px;
}

/* Search Section */
.search-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f4f4f4;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
    margin-bottom:20px;
}

.search-container input{
    padding:8px;
    width:250px;
}

.search-container button{
    padding:8px 15px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

.search-container button:hover{
    background:#2980b9;
}

/* Buttons */
.action-buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}
.btn{
        text-decoration:none;
    padding:8px 14px;
    color:white;
    border-radius:5px;
    font-size:14px;
    font-weight:bold;
    display:inline-block;
}

.add-btn{
    background:#27ae60;
}

.edit-btn{
    background:#3498db;
}

.edit-btn:hover{
    background:#2980b9;
}

.delete-btn{
    background:#e74c3c;
}

.delete-btn:hover{
    background:#c0392b;
}

/* Table */
.table-container{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:#3498db;
    color:white;
}

table,th,td{
    border:1px solid #ddd;
}

th,td{
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f9f9f9;
}

/* Back Button */
.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 15px;
    background:#2c3e50;
    color:white;
    text-decoration:none;
    border-radius:5px;
}
</style>

</head>
<body>

<!-- Sidebar -->
<div class="sidebar">

    <h2>BrainWorks</h2>

    <a th:href="@{/admin/dashboard}">🏠 Home</a>
    <a th:href="@{/admin/courses}">🏷️ Courses</a>
    <a th:href="@{/admin/students}">👨‍🎓 Students</a>
    <a th:href="@{/admin/payments}">💳 Payments</a>

</div>

<!-- Main Content -->
<div class="main-content">

    <div class="header">
        <h1>Course Management</h1>
        <p>Manage all available courses</p>
    </div>

    <!-- Search & Add -->
    <div class="search-container">

        <form th:action="@{/admin/course/search}" method="get">

            <input type="text"
                   name="title"
                   placeholder="Search Course By Title">

            <button type="submit">
                Search
            </button>

        </form>

        <a th:href="@{/admin/course/add}"
           class="btn add-btn">
            + Add Course
        </a>

    </div>

    <!-- Course Table -->
    <div class="table-container">

        <table>

            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Price</th>
                <th>Duration</th>
                <th>Action</th>
            </tr>

            <tr th:each="course : ${courses}">

                <td th:text="${course.id}"></td>

                <td th:text="${course.title}"></td>

                <td th:text="${course.description}"></td>

                <td th:text="${course.price}"></td>

                <td th:text="${course.duration}"></td>

                <td class="action-buttons">

                    <a class="btn edit-btn"
                       th:href="@{/admin/course/edit/{id}(id=${course.id})}">
                        Edit
                    </a>

                    <a class="btn delete-btn"
                       th:href="@{/admin/course/delete/{id}(id=${course.id})}">
                        Delete
                    </a>

                </td>

            </tr>

        </table>

    </div>

    <a class="back-btn"
       th:href="@{/admin/dashboard}">
        ← Back To Dashboard
    </a>

</div>

</body>
</html>
